[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md-workflows"
version = "0.2.0"
description = "Molecular dynamics workflow orchestration scripts"
requires-python = ">=3.10"
dependencies = [
    "gemmi>=0.6",
    "pydantic>=2",
    "pyyaml>=6",
    "tomli>=1.1; python_version < '3.11'",
    "typer>=0.12",
]

[project.optional-dependencies]
# Dev/CI tooling only — kept out of [project.dependencies] so it is not baked into the
# runtime image. CI installs it via `pip install .[dev]` (or plain `pip install ruff`).
dev = [
    "ruff>=0.15.19",
    "pytest>=8",
]

[project.scripts]
# Single Typer app; subcommands replace the old per-step dotted entry points.
md-workflows = "md_workflows.cli:app"

[tool.setuptools.packages.find]
include = ["md_workflows*"]

[tool.ruff]
# Pin the knobs so local runs and CI agree regardless of ruff's shifting defaults.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, isort, pyupgrade, bugbear.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's public API puts Option()/Argument() calls in parameter defaults by design.
"md_workflows/cli.py" = ["B008"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
