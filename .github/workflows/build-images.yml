name: Build & push md-workflows images

# Builds the three-stage image chain (base -> gromacs -> actl) on GitHub-hosted runners and
# publishes every stage to Harbor's private `diffuse` project. Nothing goes to Docker Hub: the
# chain starts from the public nvidia/cuda image and downloads ChimeraX from UCSF, so a build
# needs no third-party registry credentials. The actl catalog pins the final image by digest.
#
# Harbor is reachable only over the tailnet: each job joins it as an ephemeral tag:ci-n device
# (Tailscale trust credential, no stored Tailscale secret), which can reach Harbor and nothing
# else. base and gromacs carry the non-redistributable ChimeraX, which is why every stage stays
# in the private project.
#
# Tags in the `diffuse` project are immutable, so every push uses tags unique to the run:
# `<stage>-<semver>-b<run>` for the intermediates (`.<attempt>` is appended on a re-run of all
# jobs), and for the final image `<semver>-b<run>` plus `sha-<short>` on the first attempt of a
# push build. There are no moving tags and no registry build cache.
#
# Security: this workflow has NO pull_request trigger, so fork PRs can never reach the publish
# credentials. Builds run only on push to `astera` (path-filtered) and manual dispatch. All three
# jobs use the `harbor-publish` environment (deployable from `astera` only), which holds the
# Tailscale trust credential (TS_CI_CLIENT_ID, TS_CI_AUDIENCE) and the Harbor robot
# (HARBOR_USERNAME, HARBOR_PASSWORD).
on:
  push:
    branches: [astera]
    paths:
      - Dockerfile.base
      - Dockerfile.gromacs
      - Dockerfile.actl
      - pyproject.toml
      - md_workflows/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_REGISTRY: harbor.astera.sh
  HARBOR_IMAGE: harbor.astera.sh/diffuse/md-workflows

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      build: ${{ steps.v.outputs.build }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        name: Derive version from pyproject.toml
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SEMVER=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${SEMVER}" ]; then echo "could not parse version from pyproject.toml" >&2; exit 1; fi
          # Harbor tags are immutable: a re-run of all jobs must not reuse the first attempt's tags.
          BUILD="${SEMVER}-b${RUN_NUMBER}"
          if [ "${RUN_ATTEMPT}" != "1" ]; then BUILD="${BUILD}.${RUN_ATTEMPT}"; fi
          SHORT="${GITHUB_SHA::7}"
          {
            echo "semver=${SEMVER}"
            echo "build=${BUILD}"
            echo "sha=sha-${SHORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: ${SEMVER} / ${BUILD} / sha-${SHORT}"

  base:
    name: Build base
    needs: version
    runs-on: ubuntu-latest
    environment: harbor-publish
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n
      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${HARBOR_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::${HARBOR_REGISTRY} unreachable over the tailnet"; exit 1
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.HARBOR_IMAGE }}:base-${{ needs.version.outputs.build }}

  gromacs:
    name: Build gromacs
    needs: [version, base]
    runs-on: ubuntu-latest
    environment: harbor-publish
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n
      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${HARBOR_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::${HARBOR_REGISTRY} unreachable over the tailnet"; exit 1
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gromacs
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.HARBOR_IMAGE }}@${{ needs.base.outputs.digest }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:gromacs-${{ needs.version.outputs.build }}

  actl:
    name: Build actl (consumable)
    needs: [version, base, gromacs]
    runs-on: ubuntu-latest
    environment: harbor-publish
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n
      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${HARBOR_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::${HARBOR_REGISTRY} unreachable over the tailnet"; exit 1
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      # `sha-<short>` is pushed only on the first attempt of a push build: a manual dispatch or a
      # re-run of an already-published commit would hit the immutable tag and fail the push.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.actl
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GROMACS_IMAGE=${{ env.HARBOR_IMAGE }}@${{ needs.gromacs.outputs.digest }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ needs.version.outputs.build }}
            ${{ (github.event_name == 'push' && github.run_attempt == '1') && format('{0}:{1}', env.HARBOR_IMAGE, needs.version.outputs.sha) || '' }}
      - name: Report digests
        env:
          BASE_DIGEST: ${{ needs.base.outputs.digest }}
          GROMACS_DIGEST: ${{ needs.gromacs.outputs.digest }}
          ACTL_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          echo "base    digest: ${BASE_DIGEST}"
          echo "gromacs digest: ${GROMACS_DIGEST}"
          echo "actl    digest: ${ACTL_DIGEST}"
          {
            echo "Published \`${HARBOR_IMAGE}:${BUILD}@${ACTL_DIGEST}\`"
            echo
            echo "actl catalog ref: \`${HARBOR_IMAGE}:${BUILD}@${ACTL_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
