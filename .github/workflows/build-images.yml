name: Build & push md-workflows images

# Builds the three-stage image chain and publishes it, all on GitHub-hosted runners. The
# ChimeraX-dependent base/gromacs intermediates go to a PRIVATE Docker Hub repo. The final actl
# image goes to Harbor's private `diffuse` project, which the actl catalog pins by digest.
#
# Harbor is reachable only over the tailnet: the actl job joins it as an ephemeral tag:ci-n
# device (Tailscale trust credential, no stored Tailscale secret), which can reach Harbor and
# nothing else. Tags in the `diffuse` project are immutable, so every push uses tags unique to
# the run.
#
# Security: this workflow has NO pull_request trigger, so fork PRs can never reach the publish
# credentials. Heavy builds run only on push to `astera` (path-filtered) and manual dispatch.
# The Docker Hub intermediates use the `harbor` GitHub Environment; the Harbor push uses
# `harbor-publish`, which holds the Tailscale trust credential (TS_CI_CLIENT_ID,
# TS_CI_AUDIENCE), the Harbor robot (HARBOR_USERNAME, HARBOR_PASSWORD) and Docker Hub read
# access (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN). Both are deployable from `astera` only.
on:
  push:
    branches: [astera]
    paths:
      - Dockerfile.base
      - Dockerfile.gromacs
      - Dockerfile.actl
      - pyproject.toml
      - md_workflows/**
      - .github/workflows/build-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  HARBOR_REGISTRY: harbor.astera.sh
  # Docker Hub registry host for login + image refs. NOTE: it is `docker.io`, NOT the website
  # `hub.docker.com` (that's the UI, not a registry endpoint).
  DOCKERHUB_REGISTRY: docker.io
  # base + gromacs bake the non-redistributable ChimeraX, so they publish to the PRIVATE Docker
  # Hub repo (not public), distinguished by a stage tag prefix. The final consumable actl image,
  # which carries ChimeraX too, lands in Harbor's private `diffuse` project.
  DOCKERHUB_IMAGE: docker.io/diffuseproject/md
  HARBOR_IMAGE: harbor.astera.sh/diffuse/md-workflows

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.v.outputs.semver }}
      build: ${{ steps.v.outputs.build }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Derive version from pyproject.toml
        run: |
          set -euo pipefail
          SEMVER=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "${SEMVER}" ]; then echo "could not parse version from pyproject.toml" >&2; exit 1; fi
          SHORT="${GITHUB_SHA::7}"
          echo "semver=${SEMVER}"                       >> "$GITHUB_OUTPUT"
          echo "build=${SEMVER}-b${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${SHORT}"                       >> "$GITHUB_OUTPUT"
          echo "Resolved: ${SEMVER} / ${SEMVER}-b${{ github.run_number }} / sha-${SHORT}"

  base:
    name: Build base
    needs: version
    runs-on: ubuntu-latest
    environment: harbor
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:base-${{ needs.version.outputs.semver }}
            ${{ env.DOCKERHUB_IMAGE }}:base-${{ needs.version.outputs.build }}
            ${{ env.DOCKERHUB_IMAGE }}:base-${{ needs.version.outputs.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:base
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:base-buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:base-buildcache,mode=max

  gromacs:
    name: Build gromacs
    needs: [version, base]
    runs-on: ubuntu-latest
    environment: harbor
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gromacs
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ env.DOCKERHUB_IMAGE }}@${{ needs.base.outputs.digest }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:gromacs-${{ needs.version.outputs.semver }}
            ${{ env.DOCKERHUB_IMAGE }}:gromacs-${{ needs.version.outputs.build }}
            ${{ env.DOCKERHUB_IMAGE }}:gromacs-${{ needs.version.outputs.sha }}
            ${{ env.DOCKERHUB_IMAGE }}:gromacs
          cache-from: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:gromacs-buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_IMAGE }}:gromacs-buildcache,mode=max

  actl:
    name: Build actl (consumable)
    needs: [version, base, gromacs]
    runs-on: ubuntu-latest
    environment: harbor-publish
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub (pull private gromacs intermediate)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CI_CLIENT_ID }}
          audience: ${{ vars.TS_CI_AUDIENCE }}
          tags: tag:ci-n
      - name: Wait for Harbor
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 5 "https://${HARBOR_REGISTRY}/api/v2.0/ping" && exit 0
            sleep 5
          done
          echo "::error::${HARBOR_REGISTRY} unreachable over the tailnet"; exit 1
      - name: Login to Harbor (push final image)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      # Tags in the `diffuse` project are immutable: no moving tags (actl, latest, the bare
      # semver), and no registry build cache. `build` (semver-b<run>) is unique per run.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.actl
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GROMACS_IMAGE=${{ env.DOCKERHUB_IMAGE }}@${{ needs.gromacs.outputs.digest }}
          tags: |
            ${{ env.HARBOR_IMAGE }}:${{ needs.version.outputs.build }}
            ${{ env.HARBOR_IMAGE }}:${{ needs.version.outputs.sha }}
      - name: Report digests
        run: |
          echo "base    digest: ${{ needs.base.outputs.digest }}"
          echo "gromacs digest: ${{ needs.gromacs.outputs.digest }}"
          echo "actl    digest: ${{ steps.build.outputs.digest }}"
          {
            echo "Published \`${{ env.HARBOR_IMAGE }}:${{ needs.version.outputs.build }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "actl catalog ref: \`${{ env.HARBOR_IMAGE }}:${{ needs.version.outputs.build }}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
